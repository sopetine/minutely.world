<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Minutely.">
  <meta name="theme-color" content="#5B5BF0">
  <title>Log in — Minutely</title>

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="canonical" href="https://minutely.world/login.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Minutely">
  <meta property="og:title" content="Log in — Minutely">
  <meta property="og:description" content="Sign in to Minutely.">
  <meta property="og:url" content="https://minutely.world/login.html">
  <meta property="og:image" content="https://minutely.world/assets/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Log in — Minutely">
  <meta name="twitter:description" content="Sign in to Minutely.">
  <meta name="twitter:image" content="https://minutely.world/assets/img/og.png">
  <script src="assets/js/analytics.js" defer></script>
</head>
<body data-page="login" class="page-enter">

  <a class="sr-only" href="#main">Skip to main content</a>

  <header class="top-nav" role="banner">
    <div class="top-nav-inner">
      <div class="top-nav-shell">
        <a class="top-nav-logo" href="index.html" aria-label="Minutely home">
          <span class="logo-mark" aria-hidden="true"></span>
          <span>Minutely</span>
        </a>
        <nav class="top-nav-links" aria-label="Primary">
          <a class="top-nav-link" href="index.html#hero">Overview</a>
          <a class="top-nav-link" href="index.html#features">Features</a>
          <a class="top-nav-link" href="index.html#pricing">Pricing</a>
          <a class="top-nav-link" href="index.html#faq">FAQ</a>
          <a class="top-nav-link" href="docs.html">Docs</a>
        </nav>
        <div class="top-nav-actions">
          <a class="btn btn-primary magnetic" href="payment.html?tier=pro&amp;amount=79" data-magnetic>
            <span class="magnetic-inner" style="display:inline-flex;align-items:center;gap:6px;">
              Buy for Mac
              <span class="material-symbols-outlined icon-arrow" style="font-size:16px;">arrow_forward</span>
            </span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="auth-page">
    <div class="auth-card">
      <h1>Welcome back.</h1>
      <p class="subtitle">Sign in to finish your purchase, or open your library if you already have Minutely.</p>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@work.com" required>
          <span class="field-error" data-error-for="email"></span>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          <span class="field-error" data-error-for="password"></span>
        </div>

        <div class="form-alert" id="login-alert" role="alert" hidden></div>

        <button type="submit" class="btn btn-primary btn-block magnetic" data-magnetic>
          <span class="magnetic-inner" style="display:inline-flex;align-items:center;gap:6px;">
            <span data-btn-label>Continue</span>
            <span class="material-symbols-outlined icon-arrow">arrow_forward</span>
          </span>
        </button>

        <p class="form-footnote">New to Minutely? <a href="index.html#pricing">Choose a plan</a> — you'll create your account at checkout.</p>
      </form>
    </div>
  </main>


  <script src="assets/js/init.js" defer></script>
  <script src="assets/js/magnetic.js" defer></script>
  <script src="assets/js/cursor.js" defer></script>
  <script src="assets/js/auth-ui.js" defer></script>
  <script src="assets/js/login.js" defer></script>
  <script type="module" src="assets/js/scroll.js"></script>
</body>
</html>
