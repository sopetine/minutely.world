    <text x="240" y="270" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#1E1E20">Good point. Let's plan to wrap the</text>
    <text x="240" y="284" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#1E1E20">migration in two weeks. Ben?</text>

    <rect x="234" y="296" width="3" height="20" fill="#5B5BF0" rx="1"/>
