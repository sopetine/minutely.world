    <text x="596" y="266" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#1E1E20">contact legal</text>

    <rect x="576" y="284" width="12" height="12" rx="3" fill="#5B5BF0"/>
    <path d="M579 290 l3 3 l5 -5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
