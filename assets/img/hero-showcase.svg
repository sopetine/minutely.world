    <text x="588" y="478" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="500" fill="white">Ben. By Thursday.</text>
    <text x="588" y="490" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="white" opacity="0.85">00:55 in this call</text>
