    <text x="22" y="120" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6B7077">Discovery</text>
    <text x="22" y="134" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8A8F98">Yesterday · 28 min</text>
    <text x="22" y="160" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6B7077">1:1 — Sarah</text>
    <text x="22" y="174" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8A8F98">Yesterday · 15 min</text>
    <text x="22" y="200" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6B7077">Vendor · Lattice</text>
    <text x="22" y="214" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8A8F98">2d ago · 51 min</text>
    <text x="22" y="240" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6B7077">Sprint retro</text>
    <text x="22" y="254" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8A8F98">3d ago · 35 min</text>
    <text x="22" y="280" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6B7077">Design crit</text>
    <text x="22" y="294" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8A8F98">1w ago · 1h 12m</text>
