    <circle cx="40" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="20" r="6" fill="#28C840"/>
    <text x="360" y="24" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#8A8F98" font-weight="500">minutely.app / today</text>

