    <!-- titlebar -->
    <rect width="720" height="40" rx="20" fill="#F7F7F8"/>
    <rect y="20" width="720" height="20" fill="#F7F7F8"/>
    <line x1="0" y1="40" x2="720" y2="40" stroke="#ECECEE"/>
