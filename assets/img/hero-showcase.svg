    <text x="240" y="113" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600" fill="#1E1E20">Anya</text>
    <text x="276" y="113" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#8A8F98">00:14</text>
    <text x="240" y="130" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#4A5060">Okay, so for Q3, we want to ship</text>
