    <text x="22" y="394" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6B7077">Tomorrow 10am</text>
    <text x="22" y="406" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8A8F98">1on1 w/ Marc</text>
    <text x="22" y="430" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6B7077">Friday 2pm</text>
    <text x="22" y="442" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8A8F98">Q3 launch sync</text>

