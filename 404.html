<style>
  body { padding-bottom: 0; }
  .nf {
    min-height: calc(100vh - 96px);
    display: grid; place-items: center;
    padding: 32px;
    background: var(--gradient-hero);
  }
  .nf-card {
    text-align: center;
    padding: 64px 48px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-2xl);
    box-shadow: var(--shadow-xl);
    max-width: 540px;
    width: 100%;
  }
  .nf-code {
    font-family: var(--font-mono);
    font-size: clamp(4.5rem, 13vw, 7rem);
    line-height: 1;
    letter-spacing: -0.02em;
    font-weight: 700;
    background: var(--gradient-aurora), var(--color-ink);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .nf-title {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(1.65rem, 3.3vw, 2.5rem);
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .nf-body { color: var(--color-ink-muted); margin-bottom: 32px; font-size: 1.0625rem; }
  .nf-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nf-ctas .btn { display: inline-flex; align-items: center; gap: 8px; }
  .nf-emoji { font-weight: 600; color: var(--color-ink); }
  @media (prefers-reduced-motion: no-preference) {
    .nf-card { animation: nfIn 600ms var(--ease-out-expo) backwards; }
    @keyframes nfIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  }
</style>
